<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <title>Cats</title>
    <style>
        .footer {margin-top: 80px;}
        h1 {margin-top: 5px;}

        .gallery { display: flex; flex-wrap: wrap; margin: 0 -8px; }
        .gallery-item { width: 100%; padding: 8px; box-sizing: border-box; }
        .gallery-item img { width: 100%; height: auto; display: block; }

        @media (min-width: 576px) {
            .gallery-item { width: 50%; }
        }
        @media (min-width: 768px) {
            .gallery-item { width: 33.3333%; }
        }
        @media (min-width: 1200px) {
            .gallery-item { width: 16.6666%; }
        }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="/">Cats</a>
    </nav>

    <main role="main" class="container mt-4">
      <h1>Породы кошек и виды котов</h1>
      <p>Мир кошек удивителен и разнообразен.</p>

      <section class="mb-4">
        <h2>Популярные породы</h2>
        <ul>
          <li>Британская короткошерстная</li>
          <li>Мейн-кун</li>
          <li>Сиамская</li>
        </ul>
      </section>

      <div class="gallery">
        <div class="gallery-item">
          <img src="https://news-img.gismeteo.st/ru/2025/06/shutterstock_2386006989-640x427.jpg" alt="Шотландская вислоухая">
        </div>
        <div class="gallery-item">
          <img src="https://news-img.gismeteo.st/ru/2025/06/shutterstock_1073446478-640x427.jpg" alt="Бенгальская кошка">
        </div>
        <div class="gallery-item">
          <img src="https://news-img.gismeteo.st/ru/2025/06/shutterstock_2514586673-640x427.jpg" alt="Британская короткошёрстная">
        </div>
        <div class="gallery-item">
          <img src="https://news-img.gismeteo.st/ru/2025/06/shutterstock_2428724909-1-640x424.jpg" alt="Русская голубая">
        </div>
        <div class="gallery-item">
          <img src="https://news-img.gismeteo.st/ru/2025/06/shutterstock_2608042173-640x427.jpg" alt="Рагамаффин">
        </div>
        <div class="gallery-item">
          <img src="https://avatars.mds.yandex.net/i?id=99628cb441bcc0f940c28b9787820091_l-5681290-images-thumbs&n=13" alt="Египетская">
        </div>
      </div>
    </main>

    <div class="footer container">
      <p class="text-muted">2026</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
